<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stocks</title>

<style>
body {
    background-color: rgb(245,245,220);
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;

    display: flex;
    flex-direction: column;
    height: 100vh;
}

/* Title area (centers the h1 vertically) */
.title {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

h1 {
    margin: 0;
    text-align: center;
}

/* Main layout */
.main {
    display: flex;
    align-items: flex-end;
}

/* Game iframe column */
.game {
    flex: 3;
    display: flex;
    align-items: flex-end;
}

iframe {
    border: none;
    width: 74.7vw;
    height: 85vh;
    display: block;
}


.rightspace {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    height: 85vh;
    margin-right: 50px;
    margin-left: 50px;
}


.buttonbox {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
}

.buttonbox p {
    margin: 0;
    font-weight: bold;
}

.buttonbox a {
    text-decoration: none;
}

button {
    width: 120px;
    padding: 10px;
    cursor: pointer;
}

.back-button {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 1000;
}


</style>
</head>
<body>

<a href="index.html"><button class="back-button">⬅ Home</button></a>

<div class="title">
    <h1>Fuzzerson Stock Sim</h1>
</div>


<div class="main">

    <div class="game">
        <iframe src="stocks.html" title="Stocks Game"></iframe>
    </div>

    <div class="rightspace">

        <div class="buttonbox">
            <p>Other Games?</p>

            <a href="tnaks-page.html">
                <button>
                    <img src="Tnaks icon.png" width="70" height="70">
                    <br>Tnaks!
                </button>
            </a>

            <a href="tetris.html">
                <button>
                    <img src="tetris.png" width="70" height="70">
                    <br>Tetris
                </button>
            </a>

            <a href="bloxorz.html">
                <button>
                    <img src="blockorzz.webp" width="70" height="70">
                    <br>Blockorz
                </button>
            </a>

            <a href="stocks.html">
                <button>
                    Fullscreen Mode!
                </button>
            </a>

        </div>

    </div>

</div>

</body>
</html>
